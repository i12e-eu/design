<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="description" content="The i12e design index. Explore the logotype and its variants."/>
    <title>i12e — Design</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400&display=swap" rel="stylesheet"/>
    <style>
        :root {
            color-scheme: light;
            font-family: "Roboto Mono", monospace;
            color: #191919;
            background: #f7f7f7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 48px 24px;
        }

        main {
            max-width: 960px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 48px;
            font-size: 1rem;
            font-weight: 400;
        }

        h1 span, .variant {
            color: #666;
        }

        .designs {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .design-link {
            display: block;
            padding: 20px 0;
            border-top: 1px solid #d8d8d8;
            border-bottom: 1px solid #d8d8d8;
            color: inherit;
            text-decoration: none;
        }

        .details {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 20px;
        }

        h2 {
            margin: 0;
            font-size: 0.875rem;
            font-weight: 400;
        }

        .variant {
            margin: 6px 0 0;
            font-size: 0.75rem;
            line-height: 1.6;
        }

        .preview {
            height: 172px;
            overflow: hidden;
            background: #fff;
        }

        iframe {
            display: block;
            width: 100%;
            min-width: 640px;
            height: 100%;
            border: 0;
            pointer-events: none;
        }

        .design-link:hover h2 {
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .design-link:focus-visible {
            outline: 2px solid #191919;
            outline-offset: 6px;
        }

        @media (max-width: 600px) {
            body {
                padding: 28px 18px;
            }

            h1 {
                margin-bottom: 36px;
            }
        }
    </style>
</head>
<body>
<main>
    <h1>i12e <span>/ design</span></h1>
    <ul class="designs" aria-label="Design elements">
        <li>
            <a class="design-link" href="./i12e.html" aria-labelledby="logotype-title logotype-variant">
                <div class="details">
                    <div>
                        <h2 id="logotype-title">Logotype</h2>
                        <p class="variant" id="logotype-variant">05 / EU flag → leading flag · Primary</p>
                    </div>
                    <span aria-hidden="true">↗</span>
                </div>
                <div class="preview">
                    <!-- Reuse the chosen variant with its default looping animation. -->
                    <iframe src="./i12e.svg?variant=6&amp;preview=1"
                            title="Primary i12e logotype — variant 05, EU flag to leading flag"
                            tabindex="-1" aria-hidden="true"></iframe>
                </div>
            </a>
        </li>
    </ul>
</main>
</body>
</html>
